name: pkr-split-validity-v0.38
on:
  push:
    paths:
      - '.github/workflows/pkr-split-validity-v038.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pkr38
          create-args: >-
            python=3.11
            numpy
            lhapdf
            -c conda-forge
          init-shell: bash
          cache-environment: true
      - name: Install CT18NLO
        shell: bash -el {0}
        run: lhapdf install CT18NLO
      - name: Run split-coupling scan
        shell: bash -el {0}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/pkr_split_coupling_validity_v0_38.py
      - name: Commit results
        shell: bash -el {0}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/v0.38/
          if ! git diff --cached --quiet; then
            git commit -m 'results: v0.38 split-coupling PKR validity scan [skip ci]'
            git push
          fi
