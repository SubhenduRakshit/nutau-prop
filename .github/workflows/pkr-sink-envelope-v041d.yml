name: pkr-sink-envelope-v0.41d
on:
  push:
    paths:
      - 'scripts/pkr_sink_envelope_v0_41d.py'
      - '.github/workflows/pkr-sink-envelope-v041d.yml'
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: nutau
          create-args: >-
            python=3.11 numpy scipy pandas lhapdf -c conda-forge
      - name: Install CT18NLO
        shell: micromamba-shell {0}
        run: lhapdf install CT18NLO
      - name: Install package
        shell: micromamba-shell {0}
        run: pip install -e .
      - name: Run sink envelope
        shell: micromamba-shell {0}
        run: python scripts/pkr_sink_envelope_v0_41d.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/v0.41d
          git commit -m 'results: constrained PKR sink envelope v0.41d' || exit 0
          git push
