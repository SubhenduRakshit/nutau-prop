name: pkr-horizon-gate-v0.42c
on:
  push:
    paths:
      - 'scripts/pkr_horizon_gate_v0_42c.py'
      - '.github/workflows/pkr-horizon-gate-v042c.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: nutau
          create-args: >-
            python=3.11 numpy scipy pandas lhapdf -c conda-forge
      - name: Install CT18NLO
        shell: micromamba-shell {0}
        run: lhapdf install CT18NLO
      - name: Install package
        shell: micromamba-shell {0}
        run: pip install -e .
      - name: Run horizon gate
        shell: micromamba-shell {0}
        run: |
          mkdir -p results/v0.42c
          set +e
          python scripts/pkr_horizon_gate_v0_42c.py > results/v0.42c/run.log 2>&1
          code=$?
          cat results/v0.42c/run.log
          echo "$code" > results/v0.42c/exit_code.txt
          exit $code
      - name: Commit results or failure diagnostics
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/v0.42c
          git commit -m 'results: v0.42c horizon gate diagnostics' || exit 0
          git push
