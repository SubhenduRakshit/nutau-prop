name: resolved-dipole-fast-v0.36

on:
  push:
    paths:
      - '.github/workflows/resolved-dipole-fast-v036.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: dip36fast
          create-args: >-
            python=3.11
            numpy
            lhapdf
            -c conda-forge
          init-shell: bash
          cache-environment: true
      - name: Install CT18NLO
        shell: bash -el {0}
        run: lhapdf install CT18NLO
      - name: Fast PKR Eq4.3 decision scan
        shell: bash -el {0}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          # Eq. (4.3) resolved dipole kernel is exactly 2x Eq. (4.4) at equal (M,kappa)
          # in the massless off-diagonal/sterile interpretation. Therefore 5% for Eq. (4.3)
          # is the 2.5% root of the validated Eq. (4.4) kernel, with the same moving cut.
          python scripts/resolved_derivative_selfconsistent_v0_35.py \
            --pdfs CT18NLO --energies-pev 100,300 \
            --masses-gev 5,15,40,100,220,500,1000,2000 \
            --target 0.025 --nx 48 --outdir results/v0.36-dipole-fast
      - name: Commit fast results
        shell: bash -el {0}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/v0.36-dipole-fast/
          if ! git diff --cached --quiet; then
            git commit -m 'results: v0.36 PKR Eq4.3 self-consistent dipole scan [skip ci]'
            git push
          fi
