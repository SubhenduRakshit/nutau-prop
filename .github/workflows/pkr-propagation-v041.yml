name: pkr-propagation-v0.41
on:
  push:
    paths:
      - 'scripts/propagate_pkr_final_v0_41.py'
      - '.github/workflows/pkr-propagation-v041.yml'
permissions:
  contents: write
jobs:
  propagate:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: nutau
          create-args: >-
            python=3.11 numpy scipy pandas lhapdf -c conda-forge
      - name: Install CT18NLO
        shell: micromamba-shell {0}
        run: |
          lhapdf install CT18NLO
      - name: Install package
        shell: micromamba-shell {0}
        run: pip install -e .
      - name: Run constrained Earth propagation
        shell: micromamba-shell {0}
        run: python scripts/propagate_pkr_final_v0_41.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/v0.41
          git commit -m 'results: PKR constrained Earth propagation v0.41' || exit 0
          git push
